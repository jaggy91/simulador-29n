name: Resultados del 29-N

# Noche electoral: cada 5 minutos desde el cierre de las últimas urnas (20:00 UTC = 21:00
# peninsulares, fin de la veda) hasta las 06:00 UTC del 30-N. Lee el escrutinio
# provisional (Interior vía RTVE, contrastado con Público), lo guarda y publica la web.
# GitHub puede retrasar unos minutos las ejecuciones programadas.
on:
  schedule:
    - cron: '*/5 20-23 29 11 *'
    - cron: '*/5 0-5 30 11 *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: results
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Escrutinio provisional
        run: node scripts/fetch-results.js
      - name: Guardar si ha cambiado
        run: |
          git config user.name "simulador-29n[bot]"
          git config user.email "simulador-29n@users.noreply.github.com"
          git add data/results.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Resultados provisionales $(date -u +'%H:%M') UTC"
            git pull --rebase -q && git push
          fi
      - name: Web
        run: npx vite build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: results
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
