name: Resultados del 29-N

# Noche electoral. GitHub puede retrasar o saltarse ejecuciones programadas, así que no
# se depende de un cron cada 5 minutos: basta con que arranque una ejecución, que se
# queda leyendo el escrutinio provisional (Interior vía RTVE, contrastado con Público)
# cada 5 minutos hasta las 06:00 UTC del 30-N y publica la web cada vez que cambia.
# Hay varios intentos de arranque por si alguno se retrasa; si ya hay una en marcha, los
# demás esperan y terminan enseguida porque la hora límite ya ha pasado.
# A mano (workflow_dispatch) hace una sola lectura, para probar.
on:
  schedule:
    - cron: '0 20,21,22,23 29 11 *'
    - cron: '0 0,1,2,3 30 11 *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: results
  cancel-in-progress: false

jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # para tomar la proyección previa a la veda del historial
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Escrutinio provisional cada 5 minutos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "simulador-29n[bot]"
          git config user.email "simulador-29n@users.noreply.github.com"
          end=$(date -u -d '2026-11-30 06:00' +%s)
          once=${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          while :; do
            node scripts/fetch-results.js || true
            if [ -f data/results.json ]; then node scripts/compare-final.js --provisional || true; fi
            for f in data/results.json data/projection-final.json data/final-comparison.json; do [ -f "$f" ] && git add "$f"; done
            if ! git diff --cached --quiet; then
              git commit -q -m "Resultados provisionales $(date -u +'%H:%M') UTC"
              git pull --rebase -q && git push -q
              # Publicar la web (los eventos de workflow_dispatch sí se pueden lanzar con este token).
              gh workflow run deploy.yml
            fi
            [ "$once" = 1 ] && break
            [ "$(date -u +%s)" -ge "$end" ] && break
            sleep 300
          done
