name: Actualizar y publicar

on:
  schedule:
    - cron: '17 * * * *' # cada hora (minuto 17 para evitar la congestión de la hora en punto)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

# Una sola ejecución a la vez: un cron no pisa a otro ni a un push.
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # historial completo: la comparación final usa la proyección previa a la veda
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Veda electoral (LOREG, art. 69.7; src/veda.js): desde 4 h antes del 24-nov y hasta
      # el cierre de las urnas, ni se descargan ni se guardan encuestas, y se publica la
      # versión sin encuestas.
      - name: ¿Veda electoral?
        id: veda
        run: echo "activa=$(node scripts/veda.js --estado)" >> "$GITHUB_OUTPUT"

      # El motor debe seguir reproduciendo 2023 antes de publicar nada.
      - name: Tests del motor (2023)
        run: npx vitest run test/congreso-2023.test.js test/senado-2023.test.js test/escenarios-2023.test.js

      # Candidaturas proclamadas en el BOE (≈2-nov): si las lee y cuadran, crea una
      # tarjeta oficial con las listas reales del Senado; si no, abre un aviso.
      - name: Vigilante del BOE
        id: boe
        if: github.event_name != 'push' && steps.veda.outputs.activa != 'si'
        run: node scripts/watch-boe.js
      - name: Aviso si el escrutinio definitivo no se pudo leer
        if: steps.boe.outputs.problemas_escrutinio == 'si'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Revisar el escrutinio definitivo del BOE"
          if [ -z "$(gh issue list --state open --search "$title in:title" --json number --jq '.[].number')" ]; then
            gh issue create --title "$title" --body "El vigilante encontró el escrutinio definitivo pero no pudo leerlo o compararlo (ejecución ${{ github.run_id }})."
          fi
      - name: Aviso si el BOE no cuadra
        if: steps.boe.outputs.problemas == 'si'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Revisar las candidaturas proclamadas del BOE"
          if [ -z "$(gh issue list --state open --search "$title in:title" --json number --jq '.[].number')" ]; then
            gh issue create --title "$title" --body "El vigilante encontró la proclamación pero no la aplicó: ver \`problems\` en data/candidaturas-2026.json (ejecución ${{ github.run_id }})."
          fi

      # Noticias de los RSS de medios clasificadas por IA (opción C: rumores y
      # negociaciones con dos medios se activan solos; confirmado o descartado esperan
      # revisión). Sin los secretos NEWS_AI_* el paso se salta.
      - name: Noticias (IA)
        id: news
        if: github.event_name != 'push' && steps.veda.outputs.activa != 'si'
        env:
          NEWS_AI_URL: ${{ secrets.NEWS_AI_URL }}
          NEWS_AI_KEY: ${{ secrets.NEWS_AI_KEY }}
          NEWS_AI_MODEL: ${{ secrets.NEWS_AI_MODEL }}
        run: node scripts/fetch-news.js
      - name: Aviso de noticia pendiente de revisión
        if: steps.news.outputs.revisar == 'si'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          title="Noticia pendiente de revisión: ${{ steps.news.outputs.lista }}"
          if [ -z "$(gh issue list --state open --search "${title:0:60} in:title" --json number --jq '.[].number')" ]; then
            gh issue create --title "${title:0:200}" --body "La IA propone un cambio de estado fuerte (confirmado o descartado). La tarjeta está en data/news.json, inactiva. Para aprobarla, poner \"verified\": true; para rechazarla, borrarla (ejecución ${{ github.run_id }})."
          fi

      - name: Encuestas
        id: polls
        if: github.event_name != 'push' && steps.veda.outputs.activa != 'si'
        run: node scripts/fetch-polls.js
      # Si alguien cambia en Wikipedia las cifras de una encuesta que entra en las fuentes.
      - name: Aviso de edición en Wikipedia
        if: steps.polls.outputs.ediciones == 'si'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create --title "Encuesta editada en Wikipedia ($(date -u +'%d-%m %H:%M') UTC)" --body "Una encuesta que entra en las fuentes ha cambiado de cifras en el índice. Detalle en data/poll-edits.json (ejecución ${{ github.run_id }})."

      - name: Simulación
        if: github.event_name != 'push' && steps.veda.outputs.activa != 'si'
        run: node scripts/simulate.js --n 5000

      # Laboratorio izquierda ↔ derecha: aparte de la proyección oficial.
      - name: Espectro
        if: github.event_name != 'push' && steps.veda.outputs.activa != 'si'
        run: node scripts/spectrum.js --n 2000

      # Prueba de estrés y sensibilidad de cada supuesto (METODOLOGIA.md §0, §6 y §7).
      - name: Sensibilidad
        if: github.event_name != 'push' && steps.veda.outputs.activa != 'si'
        run: node scripts/sensitivity.js --n 2000

      # Datos de la versión de veda (resultado de 2023 y noticias sin sondeos).
      - name: Datos para la veda
        run: node scripts/veda.js

      - name: Guardar datos si han cambiado
        if: github.event_name != 'push' && steps.veda.outputs.activa != 'si'
        run: |
          git config user.name "simulador-29n[bot]"
          git config user.email "simulador-29n@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios en /data"
          else
            git commit -m "Datos: actualización automática $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase -q && git push
          fi

      - name: Web
        run: npx vite build ${{ steps.veda.outputs.activa == 'si' && '--mode veda' || '' }}

      # La versión de veda se compila y se comprueba en cada ejecución, para detectar
      # cualquier fallo semanas antes. Durante la veda se comprueba la que se publica.
      - name: Comprobar la versión de veda
        run: |
          if [ "${{ steps.veda.outputs.activa }}" = "si" ]; then
            node scripts/check-veda.js dist
          else
            npx vite build --mode veda --outDir dist-veda && node scripts/check-veda.js dist-veda
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
