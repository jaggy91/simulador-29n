name: Actualizar y publicar

on:
  schedule:
    - cron: '17 * * * *' # cada hora (minuto 17 para evitar la congestión de la hora en punto)
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Una sola ejecución a la vez: un cron no pisa a otro ni a un push.
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # El motor debe seguir reproduciendo 2023 antes de publicar nada.
      - name: Tests del motor (2023)
        run: npx vitest run test/congreso-2023.test.js test/senado-2023.test.js test/escenarios-2023.test.js

      - name: Encuestas
        if: github.event_name != 'push'
        run: node scripts/fetch-polls.js

      - name: Simulación
        if: github.event_name != 'push'
        run: node scripts/simulate.js --n 5000

      - name: Guardar datos si han cambiado
        if: github.event_name != 'push'
        run: |
          git config user.name "simulador-29n[bot]"
          git config user.email "simulador-29n@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios en /data"
          else
            git commit -m "Datos: actualización automática $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
